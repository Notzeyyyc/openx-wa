plugins:
  shell: true
  device: true
  file: true
  whatsapp: false
  clipboard: true
  notification: true
  ai: true
  cron: true
  memory: true
  browser: true

server:
  http_port: 8765
  stdio: false  # HTTP only mode for local Termux

ai:
  provider: custom
  api_key: ""  # Set via OPENX_AI_API_KEY env var
  model: deepseek/deepseek-v4-pro
  base_url: "https://zelapioffciall.dpdns.org/ai/sdk"
  method: GET
  param_name: text
  apikey_param: apikey
  answer_field: response
  headers: {}

bridge:
  baileys_url: "http://localhost:3000"

dev:
  mock_device: false  # Real device mode for Termux

memory:
  storage_path: "openx-memory.json"
  max_size_bytes: 10485760  # 10MB
  auto_backup: true
  backup_count: 3

browser:
  default_provider: "jina"
  jina_timeout_seconds: 10
  user_agent: "OpenX-V2/1.0"
  cache_responses: true
  cache_dir: "openx-cache"
  max_content_size_bytes: 1048576  # 1MB
  max_cache_entries: 100
  cache_ttl_seconds: 300

mode:
  auto_detect: false  # Production: explicit remote SSH config via env vars
  local:
    enabled: false
    termux_socket: "/data/data/com.termux/files/usr/var/run/termux-socket"
    sysfs_base: "/sys"
  remote:
    enabled: true
    ssh_host: ""  # Set via OPENX_MODE_REMOTE_SSH_HOST env var
    ssh_port: 22
    ssh_key: ""  # Set via OPENX_MODE_REMOTE_SSH_KEY env var (path or inline)
    ssh_user: ""  # Set via OPENX_MODE_REMOTE_SSH_USER env var
    adb_mode: false
    tailscale_ip: ""

security:
  enabled: true
  auth_mode: "token"
  tokens: []  # Populated by OPENX_HTTP_API_KEY env var
  tool_permissions:
    shell_exec: "execute"
    file_read: "read"
    file_write: "execute"
    memory_set: "execute"
    memory_get: "read"
    memory_list: "read"
    memory_delete: "execute"
    memory_clear: "admin"
    battery_status: "read"
    network_stats: "read"
    device_info: "read"
    search_web: "read"
    browser_fetch: "read"
    browser_extract_text: "read"
    cron_add: "execute"
    cron_list: "read"
    cron_remove: "execute"
  rate_limit:
    enabled: true
    window_seconds: 60
    burst_size: 10

logging:
  level: "info"
  format: "json"
  output: "stderr"
  file: "openx.log"
  max_size_mb: 10
  max_backups: 5
  max_days: 7
  modules:
    toolchain: "info"
    auth: "info"
    device: "info"
    shell: "info"

error:
  auto_restart: true
  backoff_multiplier: 1.5
  max_backoff_seconds: 300
  save_panic_dump: true
  dump_dir: "openx-crashes"
